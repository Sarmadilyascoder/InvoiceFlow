<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="InvoiceFlow: a browser-only invoice, expense and payment tracker for small businesses." />
    <title>InvoiceFlow — Cash flow, kept clear</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <a class="skip-link" href="#view-root">Skip to main content</a>
    <div class="app-shell">
      <aside class="sidebar" aria-label="Primary navigation">
        <a href="#dashboard" class="wordmark" aria-label="InvoiceFlow home">
          <span class="mark">IF</span>
          <span>Invoice<span>Flow</span></span>
        </a>
        <div class="workspace-chip"><span class="mini-dot"></span><span>LOCAL WORKSPACE</span></div>
        <nav class="nav-list" id="primary-navigation">
          <button class="nav-item active" data-view="dashboard"><span>◌</span> Overview</button>
          <button class="nav-item" data-view="invoices"><span>□</span> Invoices</button>
          <button class="nav-item" data-view="expenses"><span>↗</span> Expenses</button>
          <button class="nav-item" data-view="clients"><span>◍</span> Clients</button>
          <button class="nav-item" data-view="reports"><span>⌁</span> Reports</button>
        </nav>
        <div class="sidebar-note">
          <span class="lock-icon">⌁</span>
          <strong>Private by design</strong>
          <p>Your records stay in this browser.</p>
        </div>
      </aside>

      <section class="surface">
        <header class="topbar">
          <button class="mobile-menu" id="mobile-menu" aria-label="Open navigation" aria-controls="primary-navigation" aria-expanded="false">☰</button>
          <div class="crumb"><span class="pulse"></span><span id="workspace-name">Mira Studio</span><small>LOCAL WORKSPACE</small></div>
          <div class="top-actions">
            <button class="icon-button" id="export-data" title="Export invoices as CSV" aria-label="Export invoices as CSV">⇩</button>
            <button class="primary-button" id="new-invoice">+ New invoice</button>
          </div>
        </header>
        <main id="view-root" tabindex="-1"></main>
      </section>
    </div>
    <div id="dialog-root"></div>
    <div class="toast-region" id="toast-region" aria-live="polite" aria-atomic="true"></div>
    <script type="module" src="app.js"></script>
  </body>
</html>
